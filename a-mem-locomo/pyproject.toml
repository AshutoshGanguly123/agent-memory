[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amem-reproduction"
version = "0.2.0"
description = "Auditable A-Mem / LoCoMo reproduction on Slurm NVIDIA CUDA"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
